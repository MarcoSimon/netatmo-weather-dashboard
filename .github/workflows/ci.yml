name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No install step and no npm cache: the project has no dependencies and
      # therefore no lockfile. node:sqlite needs 22.13 or newer.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests
        run: npm test
